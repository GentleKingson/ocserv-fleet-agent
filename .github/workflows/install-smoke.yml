name: Install Smoke

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build and smoke test
        required: false
        default: v0.3.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  install-smoke:
    name: ${{ matrix.distro }} ${{ matrix.artifact_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            distro: debian-trixie
            distro_image: debian:trixie-slim
            artifact_arch: linux-x86_64
          - runner: ubuntu-24.04
            distro: ubuntu-24.04
            distro_image: ubuntu:24.04
            artifact_arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            distro: debian-trixie
            distro_image: debian:trixie-slim
            artifact_arch: linux-aarch64
          - runner: ubuntu-24.04-arm
            distro: ubuntu-24.04
            distro_image: ubuntu:24.04
            artifact_arch: linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            version="$INPUT_VERSION"
          else
            version="v0.3.0"
          fi
          case "$version" in
            v*) ;;
            *) version="v$version" ;;
          esac
          if [[ "${#version}" -gt 64 ]]; then
            printf 'invalid release version: maximum length is 64 characters\n' >&2
            exit 2
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Resolved release version: %s\n' "$version"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh "$VERSION"

      - name: Verify release checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-checksums.sh "dist/$VERSION/SHA256SUMS"

      - name: Check matrix release artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          test -x "dist/$VERSION/ocfleet-$VERSION-$ARTIFACT_ARCH"
          test -x "dist/$VERSION/ocfleet-agent-$VERSION-$ARTIFACT_ARCH"
          test -x "dist/$VERSION/ocfleet-api-$VERSION-$ARTIFACT_ARCH"
          test -x "dist/$VERSION/ocfleet-ocserv-collector-$VERSION-$ARTIFACT_ARCH"

      - name: Run install smoke
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          DISTRO_IMAGE: ${{ matrix.distro_image }}
        run: ./scripts/ci-install-smoke.sh "$VERSION" "$ARTIFACT_ARCH" "$DISTRO_IMAGE"
