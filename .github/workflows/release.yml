name: Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build
        required: false
        default: v0.3.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.artifact_arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact_arch: linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          case "$version" in
            v*) ;;
            *) version="v$version" ;;
          esac
          if [[ "${#version}" -gt 64 ]]; then
            printf 'invalid release version: maximum length is 64 characters\n' >&2
            exit 2
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "${GITHUB_REF_TYPE}" != "tag" || "${GITHUB_REF_NAME}" != "$version" ]]; then
            printf 'release workflow must run from the matching tag: %s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Resolved release version: %s\n' "$version"

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Build release binaries
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/build-release.sh "$VERSION"

      - name: Install pinned SBOM generator
        run: cargo install cargo-cyclonedx --version 0.5.9 --locked

      - name: Generate CycloneDX SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
          SOURCE_DATE_EPOCH: 0
        run: ./scripts/generate-sbom.sh "$VERSION" "dist/$VERSION" && for sbom in dist/$VERSION/*.cdx.json; do mv "$sbom" "${sbom%.cdx.json}-$ARTIFACT_ARCH.cdx.json"; done

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Keyless-sign release artifacts and SBOMs
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for artifact in dist/$VERSION/ocfleet-*; do
            cosign sign-blob --yes --bundle "$artifact.sigstore.json" "$artifact"
          done

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/${{ steps.version.outputs.version }}/ocfleet-*

      - name: Verify release checksums
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/verify-checksums.sh "dist/$VERSION/SHA256SUMS"

      - name: Check expected artifacts
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_ARCH: ${{ matrix.artifact_arch }}
        run: |
          set -euo pipefail
          test -x "dist/$VERSION/ocfleet-$VERSION-$ARTIFACT_ARCH"
          test -x "dist/$VERSION/ocfleet-agent-$VERSION-$ARTIFACT_ARCH"
          test -x "dist/$VERSION/ocfleet-api-$VERSION-$ARTIFACT_ARCH"
          test -x "dist/$VERSION/ocfleet-ocserv-collector-$VERSION-$ARTIFACT_ARCH"
          test -f "dist/$VERSION/SHA256SUMS"
          test "$(find "dist/$VERSION" -name '*.cdx.json' | wc -l)" -eq 5
          test "$(find "dist/$VERSION" -name '*.sigstore.json' | wc -l)" -eq 9

      - name: Upload draft artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocfleet-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/${{ steps.version.outputs.version }}/ocfleet-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
            dist/${{ steps.version.outputs.version }}/ocfleet-agent-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
            dist/${{ steps.version.outputs.version }}/ocfleet-api-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
            dist/${{ steps.version.outputs.version }}/ocfleet-ocserv-collector-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
            dist/${{ steps.version.outputs.version }}/*.cdx.json
            dist/${{ steps.version.outputs.version }}/*.sigstore.json
            dist/${{ steps.version.outputs.version }}/SHA256SUMS

  draft-release:
    name: Create GitHub draft release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      - name: Assemble and verify release files
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$INPUT_VERSION"
          case "$version" in
            v*) ;;
            *) version="v$version" ;;
          esac
          if [[ "${#version}" -gt 64 ]]; then
            printf 'invalid release version: maximum length is 64 characters\n' >&2
            exit 2
          fi
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          git rev-parse --verify "refs/tags/$version^{commit}" >/dev/null
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$version^{commit}")"
          mkdir -p release-files
          for artifact_arch in linux-x86_64 linux-aarch64; do
            for binary in ocfleet ocfleet-agent ocfleet-api ocfleet-ocserv-collector; do
              artifact="$binary-$version-$artifact_arch"
              mapfile -d '' -t matches < <(
                find release-artifacts -type f -name "$artifact" -print0
              )
              if [[ "${#matches[@]}" -ne 1 ]]; then
                printf 'expected exactly one artifact named %s, found %s\n' \
                  "$artifact" "${#matches[@]}" >&2
                exit 1
              fi
              install -m 0755 "${matches[0]}" "release-files/$artifact"
              install -m 0644 "${matches[0]}.sigstore.json" \
                "release-files/$artifact.sigstore.json"
            done
            for crate in ocfleet-protocol ocfleet-config ocfleet-agent ocfleet-cli ocfleet-api; do
              artifact="$crate-$version-$artifact_arch.cdx.json"
              mapfile -d '' -t matches < <(
                find release-artifacts -type f -name "$artifact" -print0
              )
              if [[ "${#matches[@]}" -ne 1 ]]; then
                printf 'expected exactly one SBOM named %s, found %s\n' \
                  "$artifact" "${#matches[@]}" >&2
                exit 1
              fi
              install -m 0644 "${matches[0]}" "release-files/$artifact"
              install -m 0644 "${matches[0]}.sigstore.json" \
                "release-files/$artifact.sigstore.json"
            done
          done
          (
            cd release-files
            export LC_ALL=C
            sha256sum ocfleet-* > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          ./scripts/verify-release-supply-chain.sh release-files "$version"
          for artifact in release-files/ocfleet-*; do
            case "$artifact" in *.sigstore.json) continue ;; esac
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
          notes="docs/release-notes/$version.md"
          test -f "$notes"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'notes=%s\n' "$notes" >> "$GITHUB_OUTPUT"

      - name: Sign combined checksum manifest
        run: cosign sign-blob --yes --bundle release-files/SHA256SUMS.sigstore.json release-files/SHA256SUMS

      - name: Create tag-bound draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            printf 'release already exists: %s\n' "$VERSION" >&2
            exit 1
          fi
          gh release create "$VERSION" release-files/* \
            --draft \
            --verify-tag \
            --title "ocfleet $VERSION" \
            --notes-file "$NOTES"
