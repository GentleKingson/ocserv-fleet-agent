name: Release Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build
        required: false
        default: v0.2.0

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact_arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            artifact_arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            artifact_arch: linux-aarch64

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          case "$version" in
            v*) ;;
            *) version="v$version" ;;
          esac
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          printf 'Resolved release version: %s\n' "$version"

      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal

      - name: Build release binaries
        run: ./scripts/build-release.sh "${{ steps.version.outputs.version }}"

      - name: Verify release checksums
        run: ./scripts/verify-checksums.sh "dist/${{ steps.version.outputs.version }}/SHA256SUMS"

      - name: Check expected artifacts
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          artifact_arch="${{ matrix.artifact_arch }}"
          test -x "dist/$version/ocfleet-$version-$artifact_arch"
          test -x "dist/$version/ocfleet-agent-$version-$artifact_arch"
          test -f "dist/$version/SHA256SUMS"

      - name: Upload draft artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ocfleet-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
          if-no-files-found: error
          path: |
            dist/${{ steps.version.outputs.version }}/ocfleet-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
            dist/${{ steps.version.outputs.version }}/ocfleet-agent-${{ steps.version.outputs.version }}-${{ matrix.artifact_arch }}
            dist/${{ steps.version.outputs.version }}/SHA256SUMS
