name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '**/*.rs'
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'docs/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'rust-toolchain'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/dependabot.yml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Check documentation claims
        run: bash scripts/check-doc-claims.sh

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal --component clippy

      - name: Run Clippy with default features
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Clippy with all features
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Run tests with default features
        run: cargo test --workspace -j1 -- --test-threads=1

      - name: Run tests with all features
        run: cargo test --workspace --all-features -j1 -- --test-threads=1

  supply-chain:
    name: Supply-chain checks
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Check GitHub Actions pinning
        run: ./scripts/check-github-actions-pinning.sh

      - name: Check release version validation
        run: ./scripts/test-release-version-validation.sh

      - name: Install Rust toolchain
        run: rustup toolchain install 1.96.1 --profile minimal

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.4 --locked

      - name: Run cargo-deny
        run: cargo deny --all-features --locked check

      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo-audit
        run: cargo audit --ignore RUSTSEC-2024-0436
