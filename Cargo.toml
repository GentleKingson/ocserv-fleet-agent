[workspace]
resolver = "3"
members = [
  "crates/ocfleet-protocol",
  "crates/ocfleet-config",
  "crates/ocfleet-agent",
  "crates/ocfleet-cli",
  "crates/ocfleet-api",
  "crates/ocfleet-snapshot-schema",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gentlekingson/ocserv-fleet-agent"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
iroh = "1.0.1"
libc = "0.2"
rusqlite = { version = "0.34", features = ["backup", "bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
r2d2 = "0.8"
r2d2_postgres = "0.18"
postgres = "0.19"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
semver = "1"
sha2 = "0.10"
tempfile = "3"
testcontainers = { version = "0.27", features = ["blocking"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "0.8"
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["serde", "v4"] }
