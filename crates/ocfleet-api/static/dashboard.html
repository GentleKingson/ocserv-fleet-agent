<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ocfleet</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --ink: #18202b;
      --muted: #647084;
      --line: #d9dee8;
      --accent: #1967d2;
      --warn: #9d5c00;
      --crit: #b42318;
      --ok: #137333;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111418;
        --panel: #191d23;
        --ink: #edf1f7;
        --muted: #aab4c3;
        --line: #303743;
        --accent: #8ab4f8;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    h2 { margin: 0 0 12px; font-size: 15px; font-weight: 650; }
    main {
      width: min(1280px, 100%);
      margin: 0 auto;
      padding: 20px 24px 32px;
      display: grid;
      gap: 18px;
    }
    .toolbar, .audit-controls {
      display: flex;
      align-items: end;
      gap: 8px;
      flex-wrap: wrap;
    }
    .field {
      display: grid;
      gap: 4px;
    }
    label { color: var(--muted); font-size: 12px; font-weight: 650; }
    input, select {
      min-width: 160px;
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--bg);
      color: var(--ink);
    }
    #token { min-width: 260px; }
    button {
      height: 34px;
      padding: 0 12px;
      border: 1px solid var(--accent);
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 16px;
      overflow: hidden;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }
    @media (max-width: 880px) {
      .grid { grid-template-columns: 1fr; }
      header { align-items: flex-start; flex-direction: column; }
      #token { min-width: min(100%, 260px); }
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }
    .stat {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px;
      min-height: 66px;
    }
    .stat strong { display: block; font-size: 22px; line-height: 1.1; }
    .stat span { color: var(--muted); }
    #versions { margin-top: 12px; }
    .table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
    }
    th, td {
      padding: 9px 8px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th { color: var(--muted); font-size: 12px; font-weight: 650; }
    tr:last-child td { border-bottom: 0; }
    .status-healthy { color: var(--ok); }
    .status-warning, .status-degraded, .status-stale, .severity-warning { color: var(--warn); }
    .status-critical, .status-unreachable, .severity-critical { color: var(--crit); }
    .muted { color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>ocfleet</h1>
    <div class="toolbar">
      <label for="token">Bearer token</label>
      <input id="token" type="password" autocomplete="off">
      <button id="refresh" type="button">Refresh</button>
      <span id="status" class="muted" role="status" aria-live="polite"></span>
    </div>
  </header>
  <main>
    <section>
      <h2>Fleet Summary</h2>
      <div id="summary" class="stats"></div>
    </section>
    <section>
      <h2>Upgrade Readiness</h2>
      <div id="version-summary" class="stats"></div>
      <div id="versions" class="table-wrap"></div>
    </section>
    <section>
      <h2>Node Health</h2>
      <div id="nodes" class="table-wrap"></div>
    </section>
    <div class="grid">
      <section>
        <h2>Jobs</h2>
        <div id="jobs" class="table-wrap"></div>
      </section>
      <section>
        <h2>Open Alerts</h2>
        <div id="alerts" class="table-wrap"></div>
      </section>
      <section>
        <h2>Recent Runs</h2>
        <div id="runs" class="table-wrap"></div>
      </section>
      <section>
        <h2>Recent Observations</h2>
        <div id="observations" class="table-wrap"></div>
      </section>
    </div>
    <section>
      <h2>Audit Export Preview</h2>
      <form id="audit-form" class="audit-controls" method="get" action="/audit/export">
        <div class="field">
          <label for="audit-from">From</label>
          <input id="audit-from" name="from" type="datetime-local" required>
        </div>
        <div class="field">
          <label for="audit-to">To</label>
          <input id="audit-to" name="to" type="datetime-local" required>
        </div>
        <div class="field">
          <label for="audit-rows">Rows</label>
          <input id="audit-rows" name="max_rows" type="number" min="1" max="1000" value="25" required>
        </div>
        <div class="field">
          <label for="audit-redact">Redaction</label>
          <select id="audit-redact" name="redact">
            <option value="default">Default</option>
            <option value="strict">Strict</option>
          </select>
        </div>
        <button type="submit">Preview</button>
      </form>
      <div id="audit" class="table-wrap"></div>
    </section>
  </main>
  <script>
    const tokenInput = document.querySelector("#token");
    const statusEl = document.querySelector("#status");
    const text = value => value === null || value === undefined || value === "" ? "none" : String(value);
    const cls = value => String(value || "").replace(/[^a-z0-9_-]/gi, "-").toLowerCase();
    const headers = () => {
      const token = tokenInput.value.trim();
      return token ? { "Authorization": `Bearer ${token}` } : {};
    };
    async function loadJson(path) {
      const response = await fetch(path, { method: "GET", headers: headers(), cache: "no-store", credentials: "same-origin" });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.message || `${response.status}`);
      }
      return response.json();
    }
    function renderTable(target, columns, rows) {
      const container = document.querySelector(target);
      if (!rows.length) {
        const empty = document.createElement("p");
        empty.className = "muted";
        empty.textContent = "No rows";
        container.replaceChildren(empty);
        return;
      }
      const table = document.createElement("table");
      const headRow = document.createElement("tr");
      for (const column of columns) {
        const cell = document.createElement("th");
        cell.scope = "col";
        cell.textContent = column.label;
        headRow.append(cell);
      }
      const head = document.createElement("thead");
      head.append(headRow);
      const body = document.createElement("tbody");
      for (const row of rows) {
        const tableRow = document.createElement("tr");
        for (const column of columns) {
          const cell = document.createElement("td");
          const value = column.value(row);
          cell.textContent = text(value);
          if (column.className) cell.className = column.className(value);
          tableRow.append(cell);
        }
        body.append(tableRow);
      }
      table.append(head, body);
      container.replaceChildren(table);
    }
    function renderSummary(summary) {
      const container = document.querySelector("#summary");
      const stats = Object.entries(summary).map(([key, value]) => {
        const item = document.createElement("div");
        item.className = "stat";
        const number = document.createElement("strong");
        number.textContent = text(value);
        const label = document.createElement("span");
        label.textContent = key;
        item.append(number, label);
        return item;
      });
      container.replaceChildren(...stats);
    }
    async function refresh() {
      statusEl.textContent = "Loading";
      const [summary, versions, nodes, jobs, alerts, runs, observations] = await Promise.all([
        loadJson("/health/summary"),
        loadJson("/api/v1/version/readiness"),
        loadJson("/health/nodes"),
        loadJson("/jobs"),
        loadJson("/alerts?state=open&limit=25"),
        loadJson("/runs?limit=10"),
        loadJson("/observations?limit=10")
      ]);
      renderSummary(summary.summary || {});
      const versionData = versions.data || {};
      const versionSummary = {
        ready: versionData.ready_count,
        blocked: versionData.blocked_count,
        unknown: versionData.unknown_count,
        alerts: versionData.alert_count
      };
      const versionContainer = document.querySelector("#version-summary");
      const versionStats = Object.entries(versionSummary).map(([key, value]) => {
        const item = document.createElement("div");
        item.className = "stat";
        const number = document.createElement("strong");
        number.textContent = text(value);
        const label = document.createElement("span");
        label.textContent = key;
        item.append(number, label);
        return item;
      });
      versionContainer.replaceChildren(...versionStats);
      renderTable("#versions", [
        { label: "node", value: row => row.node_id },
        { label: "observed", value: row => row.observed_agent_version },
        { label: "expected", value: row => row.expected_agent_version },
        { label: "version", value: row => row.version_status },
        { label: "protocol", value: row => row.protocol_status },
        { label: "provider", value: row => row.provider_schema_status },
        { label: "readiness", value: row => row.readiness, className: value => `status-${cls(value)}` }
      ], versionData.nodes || []);
      renderTable("#nodes", [
        { label: "node", value: row => row.node_id },
        { label: "role", value: row => row.role },
        { label: "region", value: row => row.region },
        { label: "status", value: row => row.status, className: value => `status-${cls(value)}` },
        { label: "computed", value: row => row.computed_at }
      ], nodes.items || []);
      renderTable("#jobs", [
        { label: "job", value: row => row.job_id },
        { label: "kind", value: row => row.kind },
        { label: "enabled", value: row => row.enabled },
        { label: "next", value: row => row.next_run_at }
      ], jobs.items || []);
      renderTable("#alerts", [
        { label: "dedupe", value: row => row.dedupe_key },
        { label: "severity", value: row => row.severity, className: value => `severity-${cls(value)}` },
        { label: "reason", value: row => row.reason_code }
      ], alerts.items || []);
      renderTable("#runs", [
        { label: "run", value: row => row.run_id },
        { label: "status", value: row => row.status },
        { label: "observations", value: row => row.observation_count }
      ], runs.items || []);
      renderTable("#observations", [
        { label: "observation", value: row => row.observation_id },
        { label: "node", value: row => row.node_id },
        { label: "method", value: row => row.method },
        { label: "ok", value: row => row.ok }
      ], observations.items || []);
      statusEl.textContent = `Updated ${new Date().toLocaleTimeString()}`;
    }
    const localDateTime = date => {
      const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 16);
    };
    const now = new Date();
    document.querySelector("#audit-to").value = localDateTime(now);
    document.querySelector("#audit-from").value = localDateTime(new Date(now.getTime() - 86400000));
    document.querySelector("#refresh").addEventListener("click", () => refresh().catch(error => {
      statusEl.textContent = error.message;
    }));
    document.querySelector("#audit-form").addEventListener("submit", event => {
      event.preventDefault();
      const from = new Date(document.querySelector("#audit-from").value);
      const to = new Date(document.querySelector("#audit-to").value);
      const params = new URLSearchParams({
        from: from.toISOString(),
        to: to.toISOString(),
        max_rows: document.querySelector("#audit-rows").value,
        redact: document.querySelector("#audit-redact").value
      });
      loadJson(`/audit/export?${params}`).then(result => {
        renderTable("#audit", [
          { label: "time", value: row => row.ts },
          { label: "actor", value: row => row.actor },
          { label: "event", value: row => row.event },
          { label: "ok", value: row => row.ok },
          { label: "error", value: row => row.error_code }
        ], result.items || []);
      }).catch(error => { statusEl.textContent = error.message; });
    });
    refresh().catch(error => { statusEl.textContent = error.message; });
  </script>
</body>
</html>
