[package]
name = "ocfleet-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
postgres-backend = ["dep:postgres", "dep:r2d2", "dep:r2d2_postgres", "dep:tempfile"]
postgres-native-experimental = ["postgres-backend"]
controlled-writes = ["ocfleet-config/controlled-writes", "ocfleet-protocol/controlled-writes"]

[[bin]]
name = "ocfleet"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake3.workspace = true
clap.workspace = true
iroh.workspace = true
libc.workspace = true
ocfleet-config = { path = "../ocfleet-config" }
ocfleet-protocol = { path = "../ocfleet-protocol" }
reqwest.workspace = true
postgres = { workspace = true, optional = true, features = ["with-time-0_3"] }
r2d2 = { workspace = true, optional = true }
r2d2_postgres = { workspace = true, optional = true }
ring.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng.workspace = true
semver.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile = { workspace = true, optional = true }
time.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
testcontainers.workspace = true
