        "additionalProperties": false
      },
      "V1FleetSummaryEnvelope": {
        "type": "object",
        "required": ["generated_at", "data"],
        "properties": {
          "generated_at": { "$ref": "#/components/schemas/GeneratedAt" },
          "data": {
            "type": "object",
