          { "type": "object", "properties": { "item": { "$ref": "#/components/schemas/Observation" } } }
        ]
      },
      "AlertListResponse": {
        "allOf": [
          { "$ref": "#/components/schemas/ListResponse" },
          { "type": "object", "properties": { "items": { "type": "array", "maxItems": 10000, "items": { "$ref": "#/components/schemas/Alert" } } } }
        ]
      },
      "AlertResponse": {
        "allOf": [
          { "$ref": "#/components/schemas/SingleResponse" },
          { "type": "object", "properties": { "item": { "$ref": "#/components/schemas/Alert" } } }
