{
  "openapi": "3.1.1",
  "info": {
    "title": "ocfleet read-only observation API",
    "version": "0.3.0",
    "description": "Read-only, low-sensitive observation API over an existing controller SQLite database. It does not call agents, run scheduler jobs, change trust, mutate retention, or expose raw logs/config/cert/session/user/client data."
  },
  "servers": [
    {
      "url": "http://127.0.0.1:8080",
      "description": "Default loopback listener for local operator workflows"
    }
  ],
  "security": [
    {
      "BearerAuth": []
    },
    {}
  ],
  "x-ocfleet-listener-auth": {
    "loopback": "bearer-optional-local-viewer",
    "non_loopback": "bearer-required-viewer-only",
    "transport": "plain-http-upstream-requires-tls-reverse-proxy"
  },
  "paths": {
    "/api/v1/fleet/summary": {
      "get": {
        "operationId": "getV1FleetSummary",
        "summary": "Stable v1 exact fleet health summary",
        "responses": {
          "200": { "description": "Exact bounded-field fleet summary", "headers": { "ETag": { "schema": { "type": "string" } }, "X-Request-ID": { "schema": { "type": "string", "maxLength": 128 } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/V1FleetSummaryEnvelope" } } } },
          "304": { "description": "Representation has not changed" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/version/readiness": {
      "get": {
        "operationId": "getV1VersionReadiness",
        "summary": "Bounded read-only fleet version and upgrade readiness projection",
        "responses": {
          "200": { "description": "Version distribution, compatibility, readiness, and derived alerts", "headers": { "ETag": { "schema": { "type": "string" } }, "X-Request-ID": { "schema": { "type": "string", "maxLength": 128 } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/V1VersionReadinessEnvelope" } } } },
          "304": { "description": "Representation has not changed" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/nodes": {
      "get": {
        "operationId": "listV1Nodes",
        "summary": "Stable v1 cursor-paginated node health and metadata projection",
        "parameters": [
          { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 10000, "default": 50 } },
          { "name": "cursor", "in": "query", "schema": { "type": "string", "maxLength": 2048 } },
          { "name": "region", "in": "query", "schema": { "type": "string", "maxLength": 128 } },
          { "name": "role", "in": "query", "schema": { "type": "string", "maxLength": 128 } },
          { "name": "environment", "in": "query", "schema": { "type": "string", "maxLength": 128 } },
          { "name": "label", "in": "query", "description": "Exact key=value string-label match", "schema": { "type": "string", "maxLength": 193 } },
          { "name": "status", "in": "query", "schema": { "type": "string", "enum": ["healthy", "degraded", "unreachable", "stale", "disabled", "unknown"] } }
        ],
        "responses": {
          "200": { "description": "Cursor page", "headers": { "ETag": { "schema": { "type": "string" } }, "X-Request-ID": { "schema": { "type": "string", "maxLength": 128 } } }, "content": { "application/json": { "schema": { "$ref": "#/components/schemas/V1NodePageEnvelope" } } } },
          "304": { "description": "Representation has not changed" },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/api/v1/nodes/{node_id}": {
      "get": {
        "operationId": "getV1Node",
        "summary": "Stable v1 single node projection",
        "parameters": [{ "$ref": "#/components/parameters/NodeId" }],
        "responses": { "200": { "$ref": "#/components/responses/V1Single" }, "304": { "description": "Representation has not changed" }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/api/v1/health/history": {
      "get": {
        "operationId": "listV1HealthHistory",
        "summary": "Cursor-paginated health history in a half-open time window",
        "parameters": [
          { "name": "from", "in": "query", "required": true, "schema": { "type": "string", "format": "date-time" } },
          { "name": "to", "in": "query", "required": true, "schema": { "type": "string", "format": "date-time" } },
          { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 10000 } },
          { "name": "cursor", "in": "query", "schema": { "type": "string", "maxLength": 2048 } },
          { "name": "node_id", "in": "query", "schema": { "type": "string", "maxLength": 128 } },
          { "name": "status", "in": "query", "schema": { "type": "string", "enum": ["healthy", "degraded", "unreachable", "stale", "disabled", "unknown"] } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/V1Page" }, "304": { "description": "Representation has not changed" }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/alerts": {
      "get": {
        "operationId": "listV1Alerts",
        "summary": "Cursor-paginated alerts with reason and half-open time filters",
        "parameters": [
          { "name": "from", "in": "query", "required": true, "schema": { "type": "string", "format": "date-time" } },
          { "name": "to", "in": "query", "required": true, "schema": { "type": "string", "format": "date-time" } },
          { "name": "limit", "in": "query", "schema": { "type": "integer", "minimum": 1, "maximum": 10000 } },
          { "name": "cursor", "in": "query", "schema": { "type": "string", "maxLength": 2048 } },
          { "name": "state", "in": "query", "schema": { "type": "string", "enum": ["open", "silenced", "resolved"] } },
          { "name": "severity", "in": "query", "schema": { "type": "string", "enum": ["warning", "critical"] } },
          { "name": "node_id", "in": "query", "schema": { "type": "string", "maxLength": 128 } },
          { "name": "reason", "in": "query", "schema": { "type": "string", "maxLength": 128 } }
        ],
        "responses": { "200": { "$ref": "#/components/responses/V1Page" }, "304": { "description": "Representation has not changed" }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" } }
      }
    },
    "/api/v1/alerts/{dedupe_key_or_alert_id}": {
      "get": {
        "operationId": "getV1Alert",
        "summary": "Stable v1 single alert projection",
        "parameters": [{ "name": "dedupe_key_or_alert_id", "in": "path", "required": true, "schema": { "type": "string", "maxLength": 256 } }],
        "responses": { "200": { "$ref": "#/components/responses/V1Single" }, "304": { "description": "Representation has not changed" }, "400": { "$ref": "#/components/responses/BadRequest" }, "401": { "$ref": "#/components/responses/Unauthorized" }, "404": { "$ref": "#/components/responses/NotFound" } }
      }
    },
    "/": {
      "get": {
        "operationId": "getDashboard",
        "summary": "Static read-only dashboard",
        "security": [],
        "responses": {
          "200": {
            "description": "Dashboard HTML"
          }
        }
      }
    },
    "/healthz": {
      "get": {
        "operationId": "getHealthz",
        "summary": "Read-only API health check",
        "responses": {
          "200": {
            "description": "API and database are readable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/HealthzResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/metrics": {
      "get": {
        "operationId": "getMetrics",
        "summary": "Low-cardinality Prometheus controller metrics",
        "responses": {
          "200": {
            "description": "Prometheus text exposition",
            "content": {
              "text/plain": {
                "schema": {
                  "type": "string"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/health/summary": {
      "get": {
        "operationId": "getHealthSummary",
        "summary": "Fleet health summary from stored snapshots",
        "responses": {
          "200": {
            "$ref": "#/components/responses/HealthSummary"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/health/nodes": {
      "get": {
        "operationId": "listHealthNodes",
        "summary": "Node health rows",
        "responses": {
          "200": {
            "$ref": "#/components/responses/HealthNodeList"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/health/nodes/{node_id}": {
      "get": {
        "operationId": "getHealthNode",
        "summary": "Single node health row",
        "parameters": [
          {
            "$ref": "#/components/parameters/NodeId"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/HealthNode"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/health/slo": {
      "get": {
        "operationId": "getHealthSlo",
        "summary": "Bounded health SLO projection from stored rollups",
        "parameters": [
          { "name": "window", "in": "query", "required": true, "schema": { "type": "string", "enum": ["24h", "7d", "30d"] } },
          { "$ref": "#/components/parameters/To" },
          { "name": "node_id", "in": "query", "required": false, "schema": { "type": "string", "maxLength": 128 } }
        ],
        "responses": {
          "200": { "description": "Low-sensitive SLO projections with explicit missing coverage", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/HealthSloResponse" } } } },
          "400": { "$ref": "#/components/responses/BadRequest" },
          "401": { "$ref": "#/components/responses/Unauthorized" }
        }
      }
    },
    "/jobs": {
      "get": {
        "operationId": "listJobs",
        "summary": "Stored observability jobs",
        "responses": {
          "200": {
            "$ref": "#/components/responses/JobList"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/jobs/{job_id}": {
      "get": {
        "operationId": "getJob",
        "summary": "Single stored observability job",
        "parameters": [
          {
            "$ref": "#/components/parameters/JobId"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/Job"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/runs": {
      "get": {
        "operationId": "listRuns",
        "summary": "Stored scheduler run summaries",
        "parameters": [
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "$ref": "#/components/parameters/JobIdQuery"
          },
          {
            "$ref": "#/components/parameters/RunStatus"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/RunList"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/runs/{run_id}": {
      "get": {
        "operationId": "getRun",
        "summary": "Single stored scheduler run summary",
        "parameters": [
          {
            "$ref": "#/components/parameters/RunId"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/Run"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/observations": {
      "get": {
        "operationId": "listObservations",
        "summary": "Low-sensitive stored observation summaries",
        "parameters": [
          {
            "$ref": "#/components/parameters/Limit"
          },
          {
            "$ref": "#/components/parameters/NodeIdQuery"
          },
          {
            "$ref": "#/components/parameters/MethodQuery"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/ObservationList"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/observations/{observation_id}": {
      "get": {
        "operationId": "getObservation",
        "summary": "Single low-sensitive stored observation summary",
        "parameters": [
          {
            "$ref": "#/components/parameters/ObservationId"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/Observation"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/alerts": {
      "get": {
        "operationId": "listAlerts",
        "summary": "Stored alert event summaries",
        "parameters": [
          {
            "$ref": "#/components/parameters/AlertState"
          },
          {
            "$ref": "#/components/parameters/AlertSeverity"
          },
          {
            "$ref": "#/components/parameters/NodeIdQuery"
          },
          {
            "$ref": "#/components/parameters/Limit"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/AlertList"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    },
    "/alerts/{dedupe_key_or_alert_id}": {
      "get": {
        "operationId": "getAlert",
        "summary": "Single stored alert event summary",
        "parameters": [
          {
            "$ref": "#/components/parameters/AlertLookup"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/Alert"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          }
        }
      }
    },
    "/audit/export": {
      "get": {
        "operationId": "getAuditExport",
        "summary": "Bounded low-sensitive audit export rows",
        "parameters": [
          {
            "$ref": "#/components/parameters/From"
          },
          {
            "$ref": "#/components/parameters/To"
          },
          {
            "$ref": "#/components/parameters/Redact"
          },
          {
            "$ref": "#/components/parameters/MaxRows"
          }
        ],
        "responses": {
          "200": {
            "$ref": "#/components/responses/AuditList"
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          }
        }
      }
    }
  },
  "components": {
    "securitySchemes": {
      "BearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "description": "Required for non-loopback listeners via a private --auth-token-file and resolves only to the viewer role. The API is plain HTTP: non-loopback deployments must use a TLS-terminating reverse proxy plus firewall/private-network controls, and must not expose port 8080 directly to the public Internet. Loopback local-operator listeners may run unauthenticated."
      }
    },
    "parameters": {
      "Limit": {
        "name": "limit",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 10000,
          "default": 50
        }
      },
      "MaxRows": {
        "name": "max_rows",
        "in": "query",
        "required": false,
        "schema": {
          "type": "integer",
          "minimum": 1,
          "maximum": 10000,
          "default": 50
        }
      },
      "NodeId": {
        "name": "node_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "NodeIdQuery": {
        "name": "node_id",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "JobId": {
        "name": "job_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "JobIdQuery": {
        "name": "job_id",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "RunId": {
        "name": "run_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "ObservationId": {
        "name": "observation_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "AlertLookup": {
        "name": "dedupe_key_or_alert_id",
        "in": "path",
        "required": true,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "MethodQuery": {
        "name": "method",
        "in": "query",
        "required": false,
        "schema": {
          "$ref": "#/components/schemas/SafeIdentifier"
        }
      },
      "RunStatus": {
        "name": "status",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "running",
            "succeeded",
            "failed",
            "skipped"
          ]
        }
      },
      "AlertState": {
        "name": "state",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "open",
            "silenced",
            "resolved"
          ]
        }
      },
      "AlertSeverity": {
        "name": "severity",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "warning",
            "critical"
          ]
        }
      },
      "From": {
        "name": "from",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "format": "date-time"
        }
      },
      "To": {
        "name": "to",
        "in": "query",
        "required": true,
        "schema": {
          "type": "string",
          "format": "date-time"
        }
      },
      "Redact": {
        "name": "redact",
        "in": "query",
        "required": false,
        "schema": {
          "type": "string",
          "enum": [
            "none",
            "default",
            "strict"
          ],
          "default": "default"
        }
      }
    },
    "responses": {
      "V1Page": {
        "description": "Signed cursor page with conditional caching",
        "headers": { "ETag": { "schema": { "type": "string" } }, "X-Request-ID": { "schema": { "type": "string", "maxLength": 128 } } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/V1GenericPageEnvelope" } } }
      },
      "V1Single": {
        "description": "Stable v1 single-record envelope",
        "headers": { "ETag": { "schema": { "type": "string" } }, "X-Request-ID": { "schema": { "type": "string", "maxLength": 128 } } },
        "content": { "application/json": { "schema": { "$ref": "#/components/schemas/V1SingleEnvelope" } } }
      },
      "HealthSummary": {
        "description": "Fleet health counts computed from stored snapshots",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/HealthSummaryResponse"
            }
          }
        }
      },
      "HealthNodeList": {
        "description": "Bounded node health list",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/HealthNodeListResponse"
            }
          }
        }
      },
      "HealthNode": {
        "description": "Single node health projection",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/HealthNodeResponse"
            }
          }
        }
      },
      "JobList": {
        "description": "Bounded observability job list",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/JobListResponse"
            }
          }
        }
      },
      "Job": {
        "description": "Single observability job projection",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/JobResponse"
            }
          }
        }
      },
      "RunList": {
        "description": "Bounded scheduler run list",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/RunListResponse"
            }
          }
        }
      },
      "Run": {
        "description": "Single scheduler run projection",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/RunResponse"
            }
          }
        }
      },
      "ObservationList": {
        "description": "Bounded low-sensitive observation list",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ObservationListResponse"
            }
          }
        }
      },
      "Observation": {
        "description": "Single low-sensitive observation projection",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ObservationResponse"
            }
          }
        }
      },
      "AlertList": {
        "description": "Bounded low-sensitive alert list",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AlertListResponse"
            }
          }
        }
      },
      "Alert": {
        "description": "Single low-sensitive alert projection",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AlertResponse"
            }
          }
        }
      },
      "AuditList": {
        "description": "Bounded audit export window",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/AuditListResponse"
            }
          }
        }
      },
      "BadRequest": {
        "description": "Invalid bounded query or identifier",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "Unauthorized": {
        "description": "Missing or invalid bearer token",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      },
      "NotFound": {
        "description": "Item not found",
        "content": {
          "application/json": {
            "schema": {
              "$ref": "#/components/schemas/ErrorResponse"
            }
          }
        }
      }
    },
    "schemas": {
      "SafeIdentifier": {
        "type": "string",
        "minLength": 1,
        "maxLength": 256,
        "pattern": "^[A-Za-z0-9_.:-]+$"
      },
      "GeneratedAt": {
        "type": "string",
        "format": "date-time"
      },
      "LowSensitiveValue": {
        "description": "Bounded JSON value after low-sensitive projection and redaction.",
        "anyOf": [
          { "type": "null" },
          { "type": "boolean" },
          { "type": "number" },
          { "type": "string", "maxLength": 256 },
          {
            "type": "array",
            "maxItems": 32,
            "items": { "$ref": "#/components/schemas/LowSensitiveValue" }
          },
          {
            "type": "object",
            "maxProperties": 32,
            "propertyNames": { "maxLength": 256 },
            "additionalProperties": { "$ref": "#/components/schemas/LowSensitiveValue" }
          }
        ]
      },
      "LowSensitiveObject": {
        "type": "object",
        "maxProperties": 32,
        "propertyNames": { "maxLength": 256 },
        "additionalProperties": { "$ref": "#/components/schemas/LowSensitiveValue" },
        "description": "Low-sensitive summary fields only, with at most four runtime nesting levels. Raw logs, raw config, raw cert data, stdout/stderr, username, client IP, session ID, cert subject/SAN/issuer/serial, secrets, tokens, paths, selectors, and command text are not part of this contract."
      },
      "HealthzResponse": {
        "type": "object",
        "required": [
          "generated_at",
          "status",
          "read_only",
          "auth_enabled"
        ],
        "properties": {
          "generated_at": {
            "$ref": "#/components/schemas/GeneratedAt"
          },
          "status": {
            "type": "string",
            "enum": [
              "ok"
            ]
          },
          "read_only": {
            "type": "boolean",
            "const": true
          },
          "auth_enabled": {
            "type": "boolean"
          }
        },
        "additionalProperties": false
      },
      "ListResponse": {
        "type": "object",
        "required": [
          "generated_at",
          "limit",
          "count",
          "items"
        ],
        "properties": {
          "generated_at": {
            "$ref": "#/components/schemas/GeneratedAt"
          },
          "limit": {
            "type": "integer",
            "minimum": 1,
            "maximum": 10000
          },
          "count": {
            "type": "integer",
            "minimum": 0,
            "maximum": 10000
          },
          "items": {
            "type": "array",
            "maxItems": 10000,
            "items": {
              "$ref": "#/components/schemas/LowSensitiveObject"
            }
          }
        },
        "additionalProperties": false
      },
      "SingleResponse": {
        "type": "object",
        "required": [
          "generated_at",
          "item"
        ],
        "properties": {
          "generated_at": {
            "$ref": "#/components/schemas/GeneratedAt"
          },
          "item": {
            "$ref": "#/components/schemas/LowSensitiveObject"
          }
        },
        "additionalProperties": false
      },
      "SummaryResponse": {
        "type": "object",
        "required": [
          "generated_at",
          "summary"
        ],
        "properties": {
          "generated_at": {
            "$ref": "#/components/schemas/GeneratedAt"
          },
          "summary": {
            "$ref": "#/components/schemas/LowSensitiveObject"
          }
        },
        "additionalProperties": false
      },
      "HealthSloProjection": {
        "type": "object",
        "required": ["node_id", "window", "from", "to", "bucket_seconds", "expected_buckets", "present_buckets", "expected_slots", "covered_slots", "missing_slots", "covered_duration_seconds", "missing_duration_seconds", "coverage_basis_points", "health_samples", "healthy_samples", "degraded_samples", "unreachable_samples", "stale_samples", "disabled_samples", "unknown_samples", "healthy_duration_seconds", "degraded_duration_seconds", "unreachable_duration_seconds", "stale_duration_seconds", "disabled_duration_seconds", "unknown_duration_seconds", "availability_eligible_samples", "service_available_basis_points", "strictly_healthy_basis_points", "observation_count", "observation_error_count", "observation_error_basis_points", "duration_sample_count", "latency_p50_ms_min", "latency_p50_ms_max", "latency_p95_ms_max", "cert_warning_count", "cert_critical_count", "fingerprint_sample_count", "fingerprint_change_count"],
        "properties": {
          "node_id": { "type": "string", "maxLength": 128 },
          "window": { "type": "string", "enum": ["24h", "7d", "30d"] },
          "from": { "type": "string", "format": "date-time" },
          "to": { "type": "string", "format": "date-time" },
          "bucket_seconds": { "type": "integer", "enum": [300, 3600, 86400] },
          "expected_buckets": { "type": "integer", "minimum": 1, "maximum": 288 },
          "present_buckets": { "type": "integer", "minimum": 0, "maximum": 288 },
          "expected_slots": { "type": "integer", "minimum": 288, "maximum": 8640 },
          "covered_slots": { "type": "integer", "minimum": 0, "maximum": 8640 },
          "missing_slots": { "type": "integer", "minimum": 0, "maximum": 8640 },
          "covered_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "missing_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "coverage_basis_points": { "type": ["integer", "null"], "minimum": 0, "maximum": 10000 },
          "health_samples": { "type": "integer", "minimum": 0 },
          "healthy_samples": { "type": "integer", "minimum": 0 },
          "degraded_samples": { "type": "integer", "minimum": 0 },
          "unreachable_samples": { "type": "integer", "minimum": 0 },
          "stale_samples": { "type": "integer", "minimum": 0 },
          "disabled_samples": { "type": "integer", "minimum": 0 },
          "unknown_samples": { "type": "integer", "minimum": 0 },
          "healthy_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "degraded_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "unreachable_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "stale_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "disabled_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "unknown_duration_seconds": { "type": "integer", "minimum": 0, "maximum": 2592000 },
          "availability_eligible_samples": { "type": "integer", "minimum": 0 },
          "service_available_basis_points": { "type": ["integer", "null"], "minimum": 0, "maximum": 10000 },
          "strictly_healthy_basis_points": { "type": ["integer", "null"], "minimum": 0, "maximum": 10000 },
          "observation_count": { "type": "integer", "minimum": 0 },
          "observation_error_count": { "type": "integer", "minimum": 0 },
          "observation_error_basis_points": { "type": ["integer", "null"], "minimum": 0, "maximum": 10000 },
          "duration_sample_count": { "type": "integer", "minimum": 0 },
          "latency_p50_ms_min": { "type": ["integer", "null"], "minimum": 0 },
          "latency_p50_ms_max": { "type": ["integer", "null"], "minimum": 0 },
          "latency_p95_ms_max": { "type": ["integer", "null"], "minimum": 0 },
          "cert_warning_count": { "type": "integer", "minimum": 0 },
          "cert_critical_count": { "type": "integer", "minimum": 0 },
          "fingerprint_sample_count": { "type": "integer", "minimum": 0 },
          "fingerprint_change_count": { "type": "integer", "minimum": 0 }
        },
        "additionalProperties": false
      },
      "HealthSloResponse": {
        "type": "object",
        "required": ["schema", "generated_at", "window", "from", "to", "node_count", "projections"],
        "properties": {
          "schema": { "type": "string", "const": "ocfleet.health_slo.v1" },
          "generated_at": { "$ref": "#/components/schemas/GeneratedAt" },
          "window": { "type": "string", "enum": ["24h", "7d", "30d"] },
          "from": { "type": "string", "format": "date-time" },
          "to": { "type": "string", "format": "date-time" },
          "node_count": { "type": "integer", "minimum": 0, "maximum": 1000 },
