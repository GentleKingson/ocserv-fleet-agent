          "unreachable",
          "stale",
          "disabled",
          "unknown"
        ],
        "properties": {
          "total": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "healthy": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "degraded": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "unreachable": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "stale": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "disabled": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "unknown": { "type": "integer", "minimum": 0, "maximum": 10000 }
        },
        "additionalProperties": false
      },
      "ObservationMethod": {
        "type": "string",
        "maxLength": 64,
        "enum": [
          "node.ping",
          "node.info",
          "probe.controller.ping",
          "probe.path.echo",
          "ocserv.service.summary",
          "ocserv.version",
          "ocserv.sessions.summary",
          "ocserv.cert.expiry",
          "ocserv.config.fingerprint"
        ]
      },
      "ObservationMethods": {
        "type": "array",
        "maxItems": 16,
        "uniqueItems": true,
        "items": {
          "$ref": "#/components/schemas/ObservationMethod"
        }
      },
      "ProjectedObservationMethod": {
        "description": "A fixed observation method, or a fail-closed marker for a polluted stored row.",
        "anyOf": [
          { "$ref": "#/components/schemas/ObservationMethod" },
          { "type": "string", "const": "<redacted>" }
        ]
      },
      "HealthNode": {
        "type": "object",
        "required": [
          "node_id",
          "endpoint_id",
          "name",
          "region",
          "role",
          "enabled",
          "status",
          "computed_at",
          "freshness_seconds",
          "last_success_at",
          "last_failure_at",
          "last_error_code",
          "degraded_methods",
          "summary"
        ],
        "properties": {
          "node_id": { "$ref": "#/components/schemas/SafeIdentifier" },
          "endpoint_id": { "$ref": "#/components/schemas/SafeIdentifier" },
          "name": { "type": "string", "maxLength": 256 },
          "region": { "type": "string", "maxLength": 128 },
          "role": { "type": "string", "maxLength": 128 },
          "enabled": { "type": "boolean" },
          "status": {
            "type": "string",
            "enum": ["healthy", "degraded", "unreachable", "stale", "disabled", "unknown"]
          },
          "computed_at": { "type": ["string", "null"], "format": "date-time" },
          "freshness_seconds": { "type": ["integer", "null"], "minimum": 0 },
          "last_success_at": { "type": ["string", "null"], "format": "date-time" },
          "last_failure_at": { "type": ["string", "null"], "format": "date-time" },
          "last_error_code": { "type": ["string", "null"], "maxLength": 128 },
          "degraded_methods": { "$ref": "#/components/schemas/ObservationMethods" },
          "summary": { "$ref": "#/components/schemas/LowSensitiveObject" }
        },
        "additionalProperties": false
      },
      "Job": {
        "type": "object",
        "required": [
          "job_id",
          "name",
          "kind",
          "enabled",
          "interval_seconds",
          "jitter_seconds",
          "timeout_ms",
          "selector",
          "source_node_id",
          "target_node_id",
          "next_run_at",
          "last_run_at",
          "created_at",
          "updated_at"
        ],
        "properties": {
          "job_id": { "$ref": "#/components/schemas/SafeIdentifier" },
          "name": { "type": ["string", "null"], "maxLength": 256 },
          "kind": { "type": "string", "maxLength": 64 },
          "enabled": { "type": "boolean" },
          "interval_seconds": { "type": "integer", "minimum": 1 },
          "jitter_seconds": { "type": "integer", "minimum": 0 },
          "timeout_ms": { "type": "integer", "minimum": 1 },
          "selector": { "type": "string", "maxLength": 256 },
          "source_node_id": { "type": ["string", "null"], "maxLength": 256, "pattern": "^[A-Za-z0-9_.:-]+$" },
          "target_node_id": { "type": ["string", "null"], "maxLength": 256, "pattern": "^[A-Za-z0-9_.:-]+$" },
          "next_run_at": { "type": ["string", "null"], "format": "date-time" },
          "last_run_at": { "type": ["string", "null"], "format": "date-time" },
          "created_at": { "$ref": "#/components/schemas/GeneratedAt" },
          "updated_at": { "$ref": "#/components/schemas/GeneratedAt" }
        },
        "additionalProperties": false
      },
      "Run": {
        "type": "object",
        "required": [
          "run_id",
          "job_id",
          "started_at",
          "finished_at",
          "status",
          "triggered_by",
          "observation_count",
          "failed_observation_count"
        ],
        "properties": {
          "run_id": { "$ref": "#/components/schemas/SafeIdentifier" },
          "job_id": { "type": ["string", "null"], "maxLength": 256, "pattern": "^[A-Za-z0-9_.:-]+$" },
          "started_at": { "$ref": "#/components/schemas/GeneratedAt" },
          "finished_at": { "type": ["string", "null"], "format": "date-time" },
          "status": { "type": "string", "enum": ["running", "succeeded", "failed", "skipped"] },
          "triggered_by": { "type": "string", "maxLength": 128 },
          "observation_count": { "type": "integer", "minimum": 0, "maximum": 10000 },
          "failed_observation_count": { "type": "integer", "minimum": 0, "maximum": 10000 }
        },
        "additionalProperties": false
      },
      "Observation": {
        "type": "object",
        "required": [
          "observation_id",
          "run_id",
          "node_id",
          "endpoint_id",
          "method",
          "ok",
          "error_code",
          "duration_ms",
          "observed_at",
          "expires_at",
          "result_class",
          "summary"
        ],
        "properties": {
          "observation_id": { "$ref": "#/components/schemas/SafeIdentifier" },
          "run_id": { "type": ["string", "null"], "maxLength": 256, "pattern": "^[A-Za-z0-9_.:-]+$" },
          "node_id": { "type": ["string", "null"], "maxLength": 256, "pattern": "^[A-Za-z0-9_.:-]+$" },
          "endpoint_id": { "type": ["string", "null"], "maxLength": 256, "pattern": "^[A-Za-z0-9_.:-]+$" },
          "method": { "$ref": "#/components/schemas/ProjectedObservationMethod" },
          "ok": { "type": ["boolean", "null"] },
          "error_code": { "type": ["string", "null"], "maxLength": 128 },
          "duration_ms": { "type": ["integer", "null"], "minimum": 0 },
          "observed_at": { "$ref": "#/components/schemas/GeneratedAt" },
          "expires_at": { "type": ["string", "null"], "format": "date-time" },
          "result_class": { "type": "string", "maxLength": 128 },
          "summary": { "$ref": "#/components/schemas/LowSensitiveObject" }
        },
        "additionalProperties": false
      },
      "Alert": {
        "type": "object",
        "required": [
          "alert_id",
          "dedupe_key",
          "node_id",
          "severity",
          "state",
          "reason_code",
          "first_seen_at",
          "last_seen_at",
          "last_sent_at",
          "resolved_at",
          "methods",
          "summary"
        ],
        "properties": {
          "alert_id": { "$ref": "#/components/schemas/SafeIdentifier" },
