          "request_id": { "type": ["string", "null"], "maxLength": 256 },
          "params_hash": { "type": ["string", "null"], "maxLength": 256 },
          "ok": { "type": ["boolean", "null"] },
          "error_code": { "type": ["string", "null"], "maxLength": 128 },
