[package]
name = "ocfleet-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ocfleet-config = { path = "../crates/ocfleet-config" }
ocfleet-protocol = { path = "../crates/ocfleet-protocol" }
serde_json = "1"
toml = "0.8"

[[bin]]
name = "protocol_frame"
path = "fuzz_targets/protocol_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false
